name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run check:native
      - name: Check local installation
        env:
          MARGIN_NOTES_APP: build/ci-install/Margin Notes.app
        run: |
          npm run install:mac
          node scripts/check-mac-signing.mjs
      - run: npm run check:desktop
